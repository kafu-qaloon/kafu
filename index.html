<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--navy:#0E2A5E;--navy2:#0A1F45;--gold:#C9A045;--gold2:#E6C673;--bg:#FBF7EE;--line:#E8DFC9;--red:#C62828;--green:#2E7D32;--muted:#6B6B6B}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--navy);font-family:Tajawal,system-ui,sans-serif;font-size:17px;-webkit-tap-highlight-color:transparent}
h1,h2,h3,.kufi{font-family:"Reem Kufi",Tajawal,sans-serif}
button{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit}
input{font-family:inherit;font-size:17px}
.wrap{max-width:760px;margin:0 auto;padding:20px 18px 48px}
.center{text-align:center}
.brand{display:flex;flex-direction:column;align-items:center;gap:6px;margin:14px 0 22px}
.brand img{width:150px;height:150px;filter:drop-shadow(0 8px 18px rgba(14,42,94,.18))}
.brand h1{font-size:46px;line-height:1.1}
.brand .tag{color:var(--gold);font-weight:800;font-size:21px}
.brand .school{color:var(--muted);font-size:15px}
.title{font-size:28px;margin:6px 0 16px}
.dots{display:flex;justify-content:center;gap:12px;margin:10px 0 8px;direction:ltr}
.dot{width:22px;height:22px;border-radius:50%;border:3px solid var(--gold);transition:.15s}
.dot.on{background:var(--navy);border-color:var(--navy);transform:scale(1.08)}
.msg{min-height:28px;font-weight:700;color:var(--red);margin:6px 0 10px}
.msg.ok{color:var(--green)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;max-width:340px;margin:0 auto;direction:ltr}
.key{height:76px;min-height:64px;border-radius:22px;background:#fff;border:2px solid var(--line);font-size:34px;font-weight:800;box-shadow:0 3px 0 var(--line)}
.key:active{transform:translateY(2px);box-shadow:none}
.key.go{background:var(--navy);color:#fff;border-color:var(--navy);font-size:24px}
.key.go:disabled{background:#8893AB;border-color:#8893AB;box-shadow:none}
.key svg{width:36px;height:36px;vertical-align:middle}
.spin{display:inline-block;width:26px;height:26px;border:3px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:r .8s linear infinite;vertical-align:middle}
@keyframes r{to{transform:rotate(360deg)}}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:6px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:48px;padding:0 20px;border-radius:14px;font-weight:800;font-size:17px}
.btn.gold{background:var(--gold);color:var(--navy2)}
.btn.navy{background:var(--navy);color:#fff}
.btn.ghost{border:2px solid var(--gold);color:var(--navy)}
.btn.ghost.light{color:var(--gold2)}
.btn:disabled{opacity:.5}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
.card{background:#fff;border:2px solid var(--line);border-radius:22px;padding:22px 16px;text-align:center;font-size:22px;font-weight:800;box-shadow:0 3px 0 var(--line);width:100%}
.card small{display:block;color:var(--gold);font-size:16px;font-weight:700;margin-top:6px}
.card:active{transform:translateY(2px)}
.empty{background:#fff;border:2px solid var(--line);border-radius:22px;padding:26px;text-align:center;font-size:19px}
header.hd{background:var(--navy);color:#fff;padding:10px 16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;position:sticky;top:0;z-index:5}
header.hd img{width:44px;height:44px}
header.hd .nm{font-weight:800;font-size:18px;flex:1;min-width:120px}
header.hd .nm span{display:block;color:var(--gold2);font-family:"Reem Kufi";font-size:15px}
header.hd .btn{min-height:42px;padding:0 14px;font-size:15px}
.hello{font-size:34px;margin:18px 0 8px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:16px 0}
.stat{background:var(--navy);color:#fff;border-radius:22px;padding:18px 8px;text-align:center}
.stat b{display:block;font-size:40px;color:var(--gold2);font-family:"Reem Kufi"}
.box{background:#fff;border:2px solid var(--line);border-radius:22px;padding:18px;margin:16px 0}
.box h2{font-size:26px;margin-bottom:12px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.field{flex:1;min-width:170px;min-height:50px;border:2px solid var(--line);border-radius:14px;padding:0 14px;background:var(--bg);color:var(--navy)}
.field:focus{outline:none;border-color:var(--gold)}
.list .it{display:flex;justify-content:space-between;align-items:center;padding:12px 2px;border-top:1px solid var(--line);font-size:18px}
.list .it:first-child{border-top:0}
.tgl{display:flex;align-items:center;gap:8px;font-weight:700;font-size:15px}
.sw{width:54px;height:30px;border-radius:30px;background:#C9C3B4;position:relative;transition:.2s}
.sw:after{content:"";position:absolute;top:3px;right:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.2s}
.sw.on{background:var(--navy)}
.sw.on:after{right:27px}
.codes{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.codes .box{margin:0}
.codes h3{font-size:20px;margin-bottom:10px}
.codes .field{width:100%;margin-bottom:10px;direction:ltr;text-align:center;letter-spacing:4px}
.note{font-size:15px;font-weight:700;margin-top:8px;min-height:20px}
.note.err{color:var(--red)}.note.ok{color:var(--green)}
.map{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:14px 0}
.st{background:#fff;border:3px solid var(--line);border-radius:22px;padding:14px 6px;text-align:center;font-weight:800;font-size:17px;position:relative}
.st .n{width:44px;height:44px;border-radius:50%;margin:0 auto 8px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:20px}
.st.current{border-color:var(--gold);box-shadow:0 0 0 4px rgba(201,160,69,.25)}
.st.locked{opacity:.45}
.st .stars{color:var(--gold);font-size:15px;min-height:18px}
.pts{display:flex;gap:12px}
.pts div{flex:1;background:var(--navy);color:#fff;border-radius:18px;padding:12px;text-align:center}
.pts b{display:block;color:var(--gold2);font-size:28px;font-family:"Reem Kufi"}
details.val{background:#fff;border:2px solid var(--line);border-radius:18px;margin:10px 0;overflow:hidden}
details.val summary{list-style:none;padding:14px 16px;font-weight:800;font-size:20px;display:flex;align-items:center;gap:10px;cursor:pointer}
details.val summary::-webkit-details-marker{display:none}
details.val summary i{width:14px;height:14px;border-radius:50%;flex:none}
details.val .bd{padding:0 18px 16px;line-height:1.8}
details.val .def{color:var(--muted);margin-bottom:8px}
details.val li{margin-inline-start:18px}
.modal{position:fixed;inset:0;background:rgba(10,31,69,.55);display:flex;align-items:center;justify-content:center;padding:20px;z-index:20}
.modal .in{background:#fff;border-radius:22px;padding:22px;max-width:380px;width:100%;text-align:center}
.modal p{font-size:19px;font-weight:700;margin-bottom:16px}
.loading{padding:60px 0;text-align:center;color:var(--muted)}
.tabs{display:flex;gap:6px;margin:14px 0 4px;overflow-x:auto;padding-bottom:4px}
.tab{flex:1 0 auto;min-width:0;min-height:48px;border-radius:14px;border:2px solid var(--line);background:#fff;font-weight:800;font-size:15px;white-space:nowrap;padding:0 6px}
@media (max-width:420px){.tab{font-size:14px;padding:0 4px}}
.tab.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.stat{cursor:default}.stat.link{cursor:pointer}.stat.link:active{transform:translateY(2px)}
.stat.link small{display:block;color:var(--gold2);font-size:13px;margin-top:4px}
.ccard{display:flex;justify-content:space-between;align-items:center;gap:10px;background:#fff;border:2px solid var(--line);border-radius:18px;padding:14px 16px;margin:10px 0;width:100%;text-align:start;box-shadow:0 3px 0 var(--line)}
.ccard b{font-size:20px;display:block}
.ccard span{color:var(--muted);font-size:15px}
.ccard .cnt{background:var(--bg);border-radius:12px;padding:6px 12px;font-weight:800;color:var(--navy);white-space:nowrap}
.mine{display:inline-block;background:var(--gold);color:var(--navy2);border-radius:8px;padding:1px 8px;font-size:13px;font-weight:800;margin-inline-start:6px;vertical-align:middle}
select.field{appearance:none;-webkit-appearance:none}
textarea.field{font-family:inherit;min-height:150px;padding:12px 14px;line-height:1.8;width:100%;resize:vertical}
.lrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:12px 0;border-top:1px solid var(--line)}
.lrow:first-child{border-top:0}
.lrow .nm{flex:1;min-width:140px;font-size:18px;font-weight:700}
.sbtn{min-height:40px;padding:0 12px;border-radius:12px;border:2px solid var(--line);background:#fff;font-weight:700;font-size:14px}
.sbtn.on{background:var(--green);border-color:var(--green);color:#fff}
.sbtn.red{color:var(--red);border-color:#E9C3C3}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:40px;padding:0 14px;border-radius:20px;border:2px solid var(--line);background:#fff;font-weight:700}
.chip.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.qrow{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;background:#fff;border:2px solid var(--line);border-radius:18px;padding:14px 16px;margin:8px 0;text-align:start;box-shadow:0 3px 0 var(--line)}
.qrow b{display:block;font-size:18px}
.ph{border-radius:10px;padding:4px 10px;font-weight:800;font-size:14px;white-space:nowrap}
.ph.pre{background:#E3ECFA;color:#1D4E9E}.ph.post{background:#E4F2E5;color:#256B2A}
.legend{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:10px 0 14px;font-size:13px;text-align:center;font-weight:700}
.legend div{border-radius:10px;padding:6px 2px}
.s1{background:#FBE3E1;color:#9B2C22}.s2{background:#FFF1D0;color:#8A5A00}.s3{background:#E3ECFA;color:#1D4E9E}.s4{background:#E1F1E3;color:#256B2A}
.chk{display:flex;gap:10px;align-items:flex-start;font-size:17px;font-weight:700;line-height:1.6}.chk input{width:22px;height:22px;margin-top:4px;flex:0 0 auto;accent-color:var(--navy)}
.ph.rej{background:#FBE9E7;color:#B23A2E}
.cnt2{display:inline-block;background:var(--bg);border-radius:10px;padding:0 10px;font-size:16px;color:var(--navy);margin-inline-start:6px}
.nomcard{border:2px solid var(--line);border-radius:18px;padding:14px;margin:12px 0;background:#FFFDF8}
.nomcard .tagline{display:inline-block;background:#FFF3D6;color:#7A5A12;border-radius:10px;padding:2px 10px;font-weight:800;font-size:14px}
.nomcard .why{font-size:17px;line-height:1.8;margin:8px 0}

const IDKEY = "kafu.identity";
const ROLE_HOME = { student: "#/learner", teacher: "#/teacher", admin: "#/admin" };
const TITLES = { principal: "مديرة المدرسة", counselor: "الموجهة الطلابية", teacher: "معلمة" };

const app = document.getElementById("app");
let sb = null;
try { sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, { auth: { persistSession: true, autoRefreshToken: true } }); }
catch (e) { app.innerHTML = '<div class="wrap"><div class="empty">تعذّر تحميل المنصة، تحقق من الإنترنت ثم حدّث الصفحة.</div></div>'; }

// ---------- أدوات ----------
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const h = (html) => { app.innerHTML = html; window.scrollTo(0, 0); };
const getId = () => { try { return JSON.parse(localStorage.getItem(IDKEY) || "null"); } catch { return null; } };
const setId = v => { try { localStorage.setItem(IDKEY, JSON.stringify(v)); } catch {} };
const clearId = () => { try { localStorage.removeItem(IDKEY); } catch {} };
const go = hash => { if (location.hash === hash) route(); else location.hash = hash; };
const brand = () => `<div class="brand"><img src="${LOGO}" alt="شعار كفو"><h1>إنت كفو</h1><div class="tag">رحلة القيم تصنع أثرًا</div><div class="school">مدرسة الإمام قالون للطفولة المبكرة</div></div>`;
const dbErr = (e) => {
  if (!e) return "";
  if (e.code === "42501" || /permission|policy|row-level/i.test(e.message || "")) return "لا تملكين صلاحية لهذا الإجراء";
  if (/fetch|network/i.test(e.message || "")) return "تعذّر الاتصال، تحقق من الإنترنت";
  return e.message || "حدث خطأ، حاول مرة أخرى";
};
async function session() { const { data } = await sb.auth.getSession(); return data.session; }
const roleOf = s => s?.user?.app_metadata?.role || "";
async function logout() { try { await sb.auth.signOut(); } catch {} clearId(); go("#/"); }
function confirmBox(text) {
  return new Promise(res => {
    const m = document.createElement("div"); m.className = "modal";
    m.innerHTML = `<div class="in"><p>${esc(text)}</p><div class="row" style="justify-content:center"><button class="btn navy" data-y>نعم</button><button class="btn ghost" data-n>إلغاء</button></div></div>`;
    document.body.appendChild(m);
    m.querySelector("[data-y]").onclick = () => { m.remove(); res(true); };
    m.querySelector("[data-n]").onclick = () => { m.remove(); res(false); };
  });
}

// ---------- الدخول ----------
let code = "";
function pageLogin(err) {
  code = "";
  const keys = [1,2,3,4,5,6,7,8,9].map(n => `<button class="key" data-k="${n}">${n}</button>`).join("");
  h(`<div class="wrap center">${brand()}
    <h2 class="title">اكتب الرمز</h2>
    <div class="dots" id="dots"></div>
    <div class="msg" id="msg">${esc(err || "")}</div>
    <div class="pad" dir="ltr">${keys}
      <button class="key" data-del aria-label="مسح"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 5H9l-6 7 6 7h12a1 1 0 0 0 1-1V6a1 1 0 0 0-1-1z"/><path d="M17 9l-6 6M11 9l6 6"/></svg></button>
      <button class="key" data-k="0">0</button>
      <button class="key go" id="go" disabled>دخول</button>
    </div></div>`);
  drawDots();
  app.querySelectorAll("[data-k]").forEach(b => b.onclick = () => addDigit(b.dataset.k));
  app.querySelector("[data-del]").onclick = delDigit;
  app.querySelector("#go").onclick = doLogin;
}
function drawDots() {
  const n = Math.max(6, Math.min(10, code.length));
  const d = document.getElementById("dots"); if (!d) return;
  d.innerHTML = Array.from({ length: n }, (_, i) => `<span class="dot${i < code.length ? " on" : ""}"></span>`).join("");
  const g = document.getElementById("go"); if (g && !g.dataset.busy) g.disabled = code.length < 6;
}
function addDigit(k) { if (busy || code.length >= 10) return; code = code + String(k); setMsg(""); drawDots(); }
function delDigit() { if (busy) return; code = code.slice(0, -1); drawDots(); }
function setMsg(t, ok) { const m = document.getElementById("msg"); if (m) { m.textContent = t; m.className = "msg" + (ok ? " ok" : ""); } }
let busy = false;
document.addEventListener("keydown", e => {
  if (!document.getElementById("dots") || busy) return;
  if (/^[0-9]$/.test(e.key)) addDigit(e.key);
  else if ("٠١٢٣٤٥٦٧٨٩".includes(e.key) && e.key.length === 1) addDigit("٠١٢٣٤٥٦٧٨٩".indexOf(e.key));
  else if (e.key === "Backspace") delDigit();
  else if (e.key === "Enter" && code.length >= 6) doLogin();
});
async function doLogin() {
  if (busy || code.length < 6) return;
  const sent = code;
  busy = true;
  const g = document.getElementById("go"); g.dataset.busy = "1"; g.disabled = true; g.innerHTML = '<span class="spin"></span>';
  const done = (msg) => { busy = false; code = ""; g.dataset.busy = ""; g.innerHTML = "دخول"; drawDots(); setMsg(msg); };
  let res;
  try {
    const { data, error } = await sb.functions.invoke("code-login", { body: { code: sent } });
    if (error) {
      let m = "تعذّر الدخول، حاول مرة أخرى";
      try { const j = await error.context.json(); if (j && j.error) m = j.error; }
      catch { if (error.name === "FunctionsFetchError") m = "تعذّر الاتصال، تحقق من الإنترنت"; }
      return done(m);
    }
    res = data;
  } catch { return done("تعذّر الاتصال، تحقق من الإنترنت"); }
  if (!res || !res.email || !res.role) return done("تعذّر الدخول، حاول مرة أخرى");
  const { data: si, error: se } = await sb.auth.signInWithPassword({ email: res.email, password: sent });
  if (se || roleOf(si.session) !== res.role) {
    try { await sb.auth.signOut(); } catch {}
    return done(se && /fetch|network/i.test(se.message || "") ? "تعذّر الاتصال، تحقق من الإنترنت" : "تعذّر الدخول، أبلغي الإدارة");
  }
  busy = false; clearId(); go("#/who");
}

// ---------- اختيار الاسم ----------
async function pageWho(s) {
  const role = roleOf(s);
  const top = (back) => `<div class="topbar">${back ? '<button class="btn ghost" id="back">رجوع</button>' : '<span></span>'}<button class="btn gold" id="out">خروج</button></div>`;
  const wire = () => { const o = document.getElementById("out"); if (o) o.onclick = logout; };
  h(`<div class="wrap">${top()}<div class="loading">جارٍ التحميل…</div></div>`); wire();
  if (role === "student") return studentClasses(top, wire);
  const q = role === "teacher"
    ? sb.from("staff").select("id, full_name").eq("role", "teacher").eq("active", true).order("full_name")
    : sb.from("staff").select("id, full_name, title").eq("role", "admin").eq("active", true).order("full_name");
  const { data, error } = await q;
  const head = `<div class="wrap">${top()}${brand()}<h2 class="title">اختاري اسمك</h2>`;
  if (error) { h(head + `<div class="empty">${esc(dbErr(error))}</div></div>`); return wire(); }
  if (!data.length) { h(head + `<div class="empty">${role === "teacher" ? "لم تُضَف أسماء المعلمات بعد، تواصلي مع الإدارة" : "لا توجد أسماء للإدارة"}</div></div>`); return wire(); }
  h(head + `<div class="cards">${data.map(p => `<button class="card" data-id="${p.id}">${esc(p.full_name)}${role === "admin" ? `<small>${esc(TITLES[p.title] || "")}</small>` : ""}</button>`).join("")}</div></div>`);
  wire();
  app.querySelectorAll("[data-id]").forEach(b => b.onclick = () => {
    const p = data.find(x => x.id === b.dataset.id);
    setId({ role, id: p.id, name: p.full_name }); go(ROLE_HOME[role]);
  });
}
async function studentClasses(top, wire) {
  const { data, error } = await sb.from("classes").select("id, name").is("archived_at", null).order("name");
  const head = `<div class="wrap">${top()}${brand()}<h2 class="title">اختر فصلك</h2>`;
  if (error) { h(head + `<div class="empty">${esc(dbErr(error))}</div></div>`); return wire(); }
  if (!data.length) { h(head + `<div class="empty">لم تُضَف الفصول بعد، تواصل مع معلمتك</div></div>`); return wire(); }
  h(head + `<div class="cards">${data.map(c => `<button class="card" data-c="${c.id}">${esc(c.name)}</button>`).join("")}</div></div>`);
  wire();
  app.querySelectorAll("[data-c]").forEach(b => b.onclick = () => studentNames(data.find(c => c.id === b.dataset.c), top, wire));
}
async function studentNames(cls, top, wire) {
  const { data, error } = await sb.from("learners").select("id, full_name").eq("class_id", cls.id).is("archived_at", null).order("full_name");
  const head = `<div class="wrap">${top(true)}<h2 class="title">اختر اسمك</h2><p style="margin:-8px 0 14px;color:var(--muted)">${esc(cls.name)}</p>`;
  if (error) h(head + `<div class="empty">${esc(dbErr(error))}</div></div>`);
  else if (!data.length) h(head + `<div class="empty">لم تُضَف الأسماء لهذا الفصل بعد</div></div>`);
  else h(head + `<div class="cards">${data.map(l => `<button class="card" data-l="${l.id}">${esc(l.full_name)}</button>`).join("")}</div></div>`);
  wire();
  document.getElementById("back").onclick = () => studentClasses(top, wire);
  app.querySelectorAll("[data-l]").forEach(b => b.onclick = () => {
    const l = data.find(x => x.id === b.dataset.l);
    setId({ role: "student", id: l.id, name: l.full_name, classId: cls.id }); go("#/learner");
  });
}

// ---------- الرأس ----------
function header(id) {
  const pre = id.role === "teacher" ? "أ. " : "";
  return `<header class="hd"><img src="${LOGO}" alt=""><div class="nm"><span>إنت كفو</span>${esc(pre + id.name)}</div>
    <button class="btn ghost light" id="chg">تغيير الاسم</button><button class="btn gold" id="out">خروج</button></header>`;
}
function wireHeader() { document.getElementById("chg").onclick = () => { clearId(); go("#/who"); }; document.getElementById("out").onclick = logout; }

// ---------- لوحة المتعلم ----------
// الصوت الآلي
const TTS = {
  ok: typeof window.speechSynthesis !== "undefined",
  voice: null,
  pick() { if (!this.ok) return; const vs = speechSynthesis.getVoices(); this.voice = vs.find(v => /^ar[-_]SA/i.test(v.lang)) || vs.find(v => /^ar/i.test(v.lang)) || null; },
  speak(text, btn) {
    if (!this.ok) return;
    try {
      speechSynthesis.cancel();
      if (!this.voice) this.pick();
      const u = new SpeechSynthesisUtterance(String(text).replace(/[«»]/g, ""));
      u.lang = this.voice?.lang || "ar-SA"; if (this.voice) u.voice = this.voice; u.rate = 0.85;
      if (btn) { btn.classList.add("on"); u.onend = u.onerror = () => btn.classList.remove("on"); }
      speechSynthesis.speak(u);
    } catch {}
  },
  stop() { if (this.ok) try { speechSynthesis.cancel(); } catch {} }
};
if (TTS.ok) { try { speechSynthesis.onvoiceschanged = () => TTS.pick(); TTS.pick(); } catch {} }
const say = (text) => TTS.ok ? `<button class="say" data-say="${esc(text)}" aria-label="استمع">🔊 استمع</button>` : "";
function wireSay(root) { root.querySelectorAll("[data-say]").forEach(b => b.onclick = (e) => { e.stopPropagation(); TTS.speak(b.dataset.say, b); }); }
const shuffle = a => { const r = [...a]; for (let i = r.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [r[i], r[j]] = [r[j], r[i]]; } return r; };
const lines = s => esc(s).split("\n").map(x => `<p>${x}</p>`).join("");

async function pageLearner(id) {
  TTS.stop();
  h(header(id) + `<div class="wrap"><div class="loading">جارٍ التحميل…</div></div>`); wireHeader();
  const [j, t] = await Promise.all([
    sb.from("learner_journey").select("value_id, name, color, sort_order, status, stars").eq("learner_id", id.id).order("sort_order"),
    sb.from("learner_totals").select("points, level").eq("learner_id", id.id).maybeSingle()
  ]);
  const body = document.querySelector(".wrap");
  if (j.error) { body.innerHTML = `<div class="empty">${esc(dbErr(j.error))}</div>`; return; }
  const st = j.data.map((v, i) => {
    const cls = v.status === "completed" ? "done" : v.status === "locked" ? "locked" : "current";
    const mark = v.status === "completed" ? "✓" : v.status === "locked" ? "🔒" : (i + 1);
    const tag = v.status === "locked" ? "div" : "button";
    return `<${tag} class="st ${cls}"${v.status === "locked" ? "" : ` data-v="${v.value_id}"`}><div class="n" style="background:${esc(v.color || "#0E2A5E")}">${mark}</div>${esc(v.name)}<div class="stars">${"★".repeat(v.stars || 0)}</div></${tag}>`;
  }).join("");
  body.innerHTML = `<h2 class="hello">أهلًا ${esc(id.name)} 👋</h2>
    <div class="pts"><div><b>${t.data?.points ?? 0}</b>نقاطي</div><div><b>${esc(t.data?.level || "مستكشف")}</b>مستواي</div></div>
    <div id="honorCards"></div>
    <h2 style="font-size:24px;margin-top:20px">رحلتي في القيم</h2>
    <p class="hint">اضغط المحطة المضيئة لتبدأ.</p><div class="map">${st}</div>
    <div id="ladderCard"></div>`;
  body.querySelectorAll("[data-v]").forEach(b => b.onclick = () => station(id, +b.dataset.v));
  loadHonorCards(id);
  const doneN = j.data.filter(v => v.status === "completed").length, total = j.data.length;
  const hero = await sb.from("badges").select("badge_key").eq("learner_id", id.id).eq("badge_key", "kafu_hero").maybeSingle();
  const lc = document.getElementById("ladderCard"); if (!lc) return;
  if (total && doneN === total) {
    lc.innerHTML = `<button class="lcard2 open" id="goLadder"><span class="ico">🏆</span><span><b>سلّم كفو</b><small>${hero.data ? "✓ أنت بطل كفو · اصعد مرة أخرى" : "اصعد إلى القمة!"}</small></span></button>`;
    document.getElementById("goLadder").onclick = () => pageLadder(id);
  } else {
    lc.innerHTML = `<div class="lcard2"><span class="ico">🔒</span><span><b>سلّم كفو</b><small>يُفتح بعد المحطات التسع · ${doneN} من ${total || 9}</small></span></div>`;
  }
}

async function station(id, valueId, step) {
  TTS.stop();
  const body = document.querySelector(".wrap");
  body.innerHTML = `<div class="loading">جارٍ التحميل…</div>`;
  const [jr, ci, ac, qq] = await Promise.all([
    sb.from("learner_journey").select("value_id, name, color, status, story_done, game_done, activity_done, quiz_best, stars").eq("learner_id", id.id).eq("value_id", valueId).maybeSingle(),
    sb.from("content_items").select("kind, title, body, sort_order").eq("value_id", valueId).order("sort_order"),
    sb.from("activities").select("id, kind, game_type, title, config").eq("value_id", valueId).order("sort_order"),
    sb.from("quiz_questions").select("id, prompt, options, correct_index, feedback, sort_order").eq("value_id", valueId).order("sort_order")
  ]);
  const err = jr.error || ci.error || ac.error || qq.error;
  if (err) { body.innerHTML = `<div class="empty">${esc(dbErr(err))}</div>`; return; }
  const J = jr.data;
  if (!J || J.status === "locked") return pageLearner(id);
  const S = {
    intro: ci.data.find(c => c.kind === "intro"),
    story: ci.data.filter(c => c.kind === "story"),
    think: ci.data.find(c => c.kind === "feedback"),
    study: ci.data.find(c => c.kind === "at_school"),
    life: ci.data.find(c => c.kind === "sustainability"),
    game: ac.data.find(a => a.kind === "game"),
    act: ac.data.find(a => a.kind === "activity"),
    ch: ac.data.find(a => a.kind === "challenge"),
    quiz: qq.data
  };
  const color = J.color || "#0E2A5E";
  const steps = [["story", "القصة", J.story_done], ["game", "اللعبة", J.game_done], ["act", "النشاط", J.activity_done], ["quiz", "الاختبار", J.quiz_best >= 60], ["ch", "التحدي", false]];
  const top = `<div class="topbar" style="margin-top:12px"><button class="btn ghost" id="toMap">→ رحلتي</button><span class="stars" style="font-size:22px;color:var(--gold)">${"★".repeat(J.stars || 0)}</span></div>
    <h2 class="sttl" style="color:${esc(color)}">محطة ${esc(J.name)}${J.status === "completed" ? " ✓" : ""}</h2>`;
  if (!S.story.length) {
    body.innerHTML = top + `<div class="empty">محتوى هذه المحطة قيد الإعداد، ترقّب! 🌱</div>`;
    document.getElementById("toMap").onclick = () => pageLearner(id);
    return;
  }
  const cur = step || (steps.find(s => !s[2]) || steps[0])[0];
  body.innerHTML = top + `<div class="steps">${steps.map(([k, n, d], i) => `<button class="stp${k === cur ? " on" : ""}${d ? " done" : ""}" data-s="${k}"><i>${d ? "✓" : i + 1}</i>${n}</button>`).join("")}</div><div id="stage"></div>`;
  document.getElementById("toMap").onclick = () => { TTS.stop(); pageLearner(id); };
  body.querySelectorAll("[data-s]").forEach(b => b.onclick = () => station(id, valueId, b.dataset.s));
  const stage = document.getElementById("stage");
  const ctx = { id, valueId, J, S, stage, next: (k) => station(id, valueId, k) };
  ({ story: stStory, game: stGame, act: stAct, quiz: stQuiz, ch: stChallenge })[cur](ctx);
}

// تسجيل الإنجاز في الخادم، ثم رسالة النقاط واكتمال المحطة
async function record(ctx, kind, score, answers) {
  const row = { learner_id: ctx.id.id, value_id: ctx.valueId, kind };
  if (score != null) row.score = score;
  if (answers) row.answers = answers;
  const { error } = await sb.from("attempts").insert(row);
  if (error) return { error: dbErr(error) };
  const { data } = await sb.from("learner_journey").select("status, name").eq("learner_id", ctx.id.id).eq("value_id", ctx.valueId).maybeSingle();
  const justDone = data?.status === "completed" && ctx.J.status !== "completed";
  let nextName = "";
  if (justDone) {
    const n = await sb.from("learner_journey").select("name, status").eq("learner_id", ctx.id.id).eq("status", "current").order("sort_order").limit(1);
    nextName = n.data?.[0]?.name || "";
  }
  return { justDone, nextName };
}
function celebrate(ctx, title, msg, pts, nextStep) {
  const box = document.createElement("div"); box.className = "modal";
  box.innerHTML = `<div class="in cele"><div class="burst">🌟</div><h3>${esc(title)}</h3>${pts ? `<div class="plus">+${pts} نقطة</div>` : ""}<p>${esc(msg)}</p><button class="btn gold" style="width:100%">${nextStep ? "التالي" : "إلى رحلتي"}</button></div>`;
  document.body.appendChild(box);
  TTS.speak(title + ". " + msg);
  box.querySelector("button").onclick = () => { box.remove(); TTS.stop(); nextStep ? ctx.next(nextStep) : pageLearner(ctx.id); };
}
async function finish(ctx, kind, pts, title, msg, nextStep, score, answers) {
  const r = await record(ctx, kind, score, answers);
  if (r.error) { ctx.stage.insertAdjacentHTML("beforeend", `<div class="note err">${esc(r.error)}</div>`); return; }
  if (r.justDone) celebrate(ctx, `أكملتَ محطة ${ctx.J.name}! 🎉`, `حصلت على شارة بطل ${ctx.J.name} و50 نقطة إضافية.` + (r.nextName ? ` انفتحت لك محطة ${r.nextName}!` : ""), pts, "ch");
  else celebrate(ctx, title, msg, pts, nextStep);
}

// القصة: المقدمة ثم الشاشات ثم سؤال التفكير
function stStory(ctx) {
  const pages = [];
  if (ctx.S.intro) pages.push({ t: "", b: ctx.S.intro.body, intro: true });
  const st = ctx.S.story; st.forEach((p, i) => pages.push({ t: i === 0 ? (p.title || "") : "", b: p.body }));
  if (ctx.S.study) pages.push({ t: "📚 " + (ctx.S.study.title || "قيمتي ودراستي"), b: ctx.S.study.body, cls: "study", tag: "قيمتي ودراستي" });
  if (ctx.S.life) pages.push({ t: "🌱 " + (ctx.S.life.title || "قيمتي في حياتي"), b: ctx.S.life.body, cls: "life", tag: "قيمتي في حياتي" });
  if (ctx.S.think) pages.push({ t: ctx.S.think.title || "فكّر قليلًا", b: ctx.S.think.body, think: true });
  let i = 0;
  const draw = () => {
    const p = pages[i], last = i === pages.length - 1;
    ctx.stage.innerHTML = `<div class="story${p.intro ? " intro" : ""}${p.think ? " think" : ""}${p.cls ? " " + p.cls : ""}">
      ${p.tag ? `<span class="tagp">${esc(p.tag)}</span>` : ""}${p.t ? `<h3>${esc(p.t)}</h3>` : ""}<div class="txt">${lines(p.b)}</div>${say(p.b)}
      <div class="pg">${pages.map((_, k) => `<span class="${k === i ? "on" : ""}"></span>`).join("")}</div></div>
      <div class="nav"><button class="btn ghost" id="prev" ${i ? "" : "disabled"}>السابق</button><button class="btn ${last ? "gold" : "navy"}" id="nxt">${last ? (ctx.J.story_done ? "إلى اللعبة" : "أنهيت القصة ✓") : "التالي"}</button></div>`;
    wireSay(ctx.stage);
    document.getElementById("prev").onclick = () => { TTS.stop(); i--; draw(); };
    document.getElementById("nxt").onclick = async (e) => {
      TTS.stop();
      if (!last) { i++; draw(); return; }
      if (ctx.J.story_done) return ctx.next("game");
      e.target.disabled = true;
      await finish(ctx, "story_viewed", 10, "أحسنت! قرأتَ القصة كلها", "هيّا إلى اللعبة!", "game");
    };
  };
  draw();
}

// اللعبة: اختر تصرّف صاحب القيمة
function stGame(ctx) {
  const g = ctx.S.game?.config;
  if (!g) { ctx.stage.innerHTML = `<div class="empty">اللعبة قيد الإعداد</div>`; return; }
  let i = 0;
  const draw = () => {
    const it = g.items[i];
    const opts = shuffle([{ t: it.right, ok: true }, { t: it.wrong, ok: false }]);
    ctx.stage.innerHTML = `<p class="hint">${esc(ctx.S.game.title)} · الموقف ${i + 1} من ${g.items.length}</p>
      <div class="sit"><div class="txt"><p>${esc(it.situation)}</p></div>${say(it.situation)}</div>
      <div class="opts">${opts.map((o, k) => `<button class="opt" data-k="${k}">${esc(o.t)}</button>`).join("")}</div>
      <div class="fb" id="fb"></div>`;
    wireSay(ctx.stage);
    ctx.stage.querySelectorAll(".opt").forEach(b => b.onclick = () => {
      const o = opts[+b.dataset.k], fb = document.getElementById("fb");
      if (!o.ok) { b.classList.add("bad"); setTimeout(() => b.classList.remove("bad"), 600); fb.className = "fb err"; fb.textContent = g.retry; TTS.speak(g.retry); return; }
      ctx.stage.querySelectorAll(".opt").forEach(x => x.disabled = true);
      b.classList.add("good"); fb.className = "fb ok"; fb.innerHTML = `${esc(it.praise)}<button class="btn navy" id="gn" style="margin-top:12px;width:100%">${i < g.items.length - 1 ? "الموقف التالي" : "إنهاء اللعبة ✓"}</button>`;
      TTS.speak(it.praise);
      document.getElementById("gn").onclick = async (e) => {
        TTS.stop();
        if (i < g.items.length - 1) { i++; draw(); return; }
        if (ctx.J.game_done) return ctx.next("act");
        e.target.disabled = true;
        await finish(ctx, "game", 20, "رائع! أنهيتَ اللعبة", "هيّا إلى النشاط!", "act");
      };
    });
  };
  draw();
}

// النشاط: التصنيف في سلّتين
function stAct(ctx) {
  const a = ctx.S.act?.config;
  if (!a) { ctx.stage.innerHTML = `<div class="empty">النشاط قيد الإعداد</div>`; return; }
  const cards = shuffle(a.cards); let i = 0; const placed = [[], []];
  const draw = () => {
    if (i >= cards.length) {
      ctx.stage.innerHTML = `<div class="sit done"><div class="txt"><p>${esc(a.done)}</p></div></div><button class="btn gold" id="an" style="width:100%;margin-top:14px">${ctx.J.activity_done ? "إلى الاختبار" : "إنهاء النشاط ✓"}</button>`;
      TTS.speak(a.done);
      document.getElementById("an").onclick = async (e) => {
        TTS.stop();
        if (ctx.J.activity_done) return ctx.next("quiz");
        e.target.disabled = true;
        await finish(ctx, "activity", 15, "أحسنت! أنهيت النشاط", "هيّا إلى الاختبار!", "quiz");
      };
      return;
    }
    const c = cards[i];
    ctx.stage.innerHTML = `<p class="hint">${esc(ctx.S.act.title)} · ضع كل بطاقة في سلّتها (${i + 1} من ${cards.length})</p>
      <div class="sit card1"><div class="txt"><p>${esc(c.text)}</p></div>${say(c.text)}</div>
      <div class="bins">${a.bins.map((n, k) => `<button class="bin b${k}" data-b="${k}"><b>${esc(n)}</b><span>${placed[k].length}</span></button>`).join("")}</div>
      <div class="fb" id="fb"></div>`;
    wireSay(ctx.stage);
    ctx.stage.querySelectorAll(".bin").forEach(b => b.onclick = () => {
      const k = +b.dataset.b, fb = document.getElementById("fb");
      if (k !== c.bin) { b.classList.add("bad"); setTimeout(() => b.classList.remove("bad"), 600); fb.className = "fb err"; fb.textContent = "حاول مرة أخرى"; TTS.speak("حاول مرة أخرى"); return; }
      placed[k].push(c); b.classList.add("good"); TTS.stop(); i++; setTimeout(draw, 350);
    });
  };
  draw();
}

// الاختبار: خمسة أسئلة، الخيارات مخلوطة، تغذية راجعة فورية
function stQuiz(ctx) {
  const Q = ctx.S.quiz;
  if (!Q.length) { ctx.stage.innerHTML = `<div class="empty">الاختبار قيد الإعداد</div>`; return; }
  const start = () => {
    let i = 0, right = 0; const answers = [];
    const draw = () => {
      const q = Q[i]; const opts = shuffle(q.options.map((t, k) => ({ t, ok: k === q.correct_index })));
      ctx.stage.innerHTML = `<p class="hint">السؤال ${i + 1} من ${Q.length}</p>
        <div class="sit"><div class="txt"><p>${esc(q.prompt)}</p></div>${say(q.prompt)}</div>
        <div class="opts">${opts.map((o, k) => `<button class="opt" data-k="${k}">${esc(o.t)}</button>`).join("")}</div><div class="fb" id="fb"></div>`;
      wireSay(ctx.stage);
      ctx.stage.querySelectorAll(".opt").forEach(b => b.onclick = () => {
        const o = opts[+b.dataset.k];
        ctx.stage.querySelectorAll(".opt").forEach((x, k) => { x.disabled = true; if (opts[k].ok) x.classList.add("good"); });
        if (o.ok) right++; else b.classList.add("bad");
        answers.push({ q: q.id, ok: o.ok });
        const fb = document.getElementById("fb");
        fb.className = "fb " + (o.ok ? "ok" : "err");
        fb.innerHTML = `${o.ok ? "إجابة صحيحة! " : "الإجابة الصحيحة مُلوّنة بالأخضر. "}${esc(q.feedback || "")}<button class="btn navy" id="qn" style="margin-top:12px;width:100%">${i < Q.length - 1 ? "السؤال التالي" : "النتيجة"}</button>`;
        TTS.speak((o.ok ? "إجابة صحيحة. " : "") + (q.feedback || ""));
        document.getElementById("qn").onclick = () => { TTS.stop(); if (i < Q.length - 1) { i++; draw(); } else result(); };
      });
    };
    const result = async () => {
      const score = Math.round(right / Q.length * 100);
      const stars = score >= 100 ? 3 : score >= 80 ? 2 : score >= 60 ? 1 : 0;
      const pts = [0, 20, 30, 40][stars];
      const msg = stars ? ["", "نجمة أولى! أنت في الطريق الصحيح.", "نجمتان! أداء رائع.", "ثلاث نجوم! أنت كفو!"][stars] : "قاربتَ! استمع للقصة مرة أخرى وجرّب.";
      ctx.stage.innerHTML = `<div class="sit done"><div class="big">${right} من ${Q.length}</div><div class="stars" style="font-size:40px;color:var(--gold)">${stars ? "★".repeat(stars) : "☆"}</div><div class="txt"><p>${esc(msg)}</p></div></div>
        <div class="nav"><button class="btn ghost" id="again">أعد الاختبار</button><button class="btn gold" id="go2">${stars ? "إلى التحدي" : "إلى القصة"}</button></div><div id="qnote"></div>`;
      document.getElementById("again").onclick = () => { TTS.stop(); start(); };
      document.getElementById("go2").onclick = () => { TTS.stop(); ctx.next(stars ? "ch" : "story"); };
      const r = await record(ctx, "quiz", score, answers);
      if (r.error) { document.getElementById("qnote").innerHTML = `<div class="note err">${esc(r.error)}</div>`; return; }
      if (r.justDone) celebrate(ctx, `أكملتَ محطة ${ctx.J.name}! 🎉`, `حصلت على شارة بطل ${ctx.J.name} و50 نقطة إضافية.` + (r.nextName ? ` انفتحت لك محطة ${r.nextName}!` : ""), pts, "ch");
      else TTS.speak(msg);
      ctx.J.quiz_best = Math.max(ctx.J.quiz_best, score);
    };
    draw();
  };
  start();
}

// التحدي: تؤكده المعلمة
function stChallenge(ctx) {
  const c = ctx.S.ch?.config;
  if (!c) { ctx.stage.innerHTML = `<div class="empty">التحدي قيد الإعداد</div>`; return; }
  ctx.stage.innerHTML = `<div class="sit chal"><h3>🏅 ${esc(ctx.S.ch.title)}</h3><div class="txt">${lines(c.text)}</div>${say(c.text)}</div>
    <p class="hint" style="text-align:center">عندما تؤكد معلمتك أنك أنجزت التحدي، تحصل على 25 نقطة.</p>
    <button class="btn navy" id="cm" style="width:100%">إلى رحلتي</button>`;
  wireSay(ctx.stage);
  document.getElementById("cm").onclick = () => { TTS.stop(); pageLearner(ctx.id); };
}

// ---------- تأكيد التحديات ----------
async function viewChallenges(el, ctx) {
  const [d, v] = await Promise.all([loadClassData(ctx), sb.from("core_values").select("id, name, sort_order").order("sort_order")]);
  if (d.err || v.error) { el.innerHTML = `<div class="empty">${esc(dbErr(d.err || v.error))}</div>`; return; }
  if (!d.classes.length) { el.innerHTML = `<div class="empty">أضيفي الفصول والأسماء أولًا.</div>`; return; }
  ctx.chal = ctx.chal || {};
  if (!d.classes.find(c => c.id === ctx.chal.c)) ctx.chal.c = d.classes[0].id;
  if (!v.data.find(x => x.id === ctx.chal.v)) ctx.chal.v = v.data[0].id;
  el.innerHTML = `<h2 style="font-size:24px;margin:12px 0 2px">تأكيد التحديات</h2>
    <p class="hint">بعد أن يحكي الطالب ما فعله، أو تصلك رسالة من ولي الأمر، اضغطي «تأكيد» فيحصل على 25 نقطة.</p>
    <div class="chips" style="margin:8px 0">${d.classes.map(c => `<button class="chip${c.id === ctx.chal.c ? " on" : ""}" data-cc="${c.id}">${esc(c.name)}</button>`).join("")}</div>
    <div class="chips" style="margin:8px 0 14px">${v.data.map(x => `<button class="chip${x.id === ctx.chal.v ? " on" : ""}" data-vv="${x.id}">${esc(x.name)}</button>`).join("")}</div>
    <div class="box" id="clist"><div class="loading">جارٍ التحميل…</div></div>`;
  el.querySelectorAll("[data-cc]").forEach(b => b.onclick = () => { ctx.chal.c = b.dataset.cc; viewChallenges(el, ctx); });
  el.querySelectorAll("[data-vv]").forEach(b => b.onclick = () => { ctx.chal.v = +b.dataset.vv; viewChallenges(el, ctx); });
  const box = document.getElementById("clist");
  const { data: ls, error: le } = await sb.from("learners").select("id, full_name").eq("class_id", ctx.chal.c).is("archived_at", null).order("full_name");
  if (le) { box.innerHTML = `<div class="note err">${esc(dbErr(le))}</div>`; return; }
  if (!ls.length) { box.innerHTML = `<div class="note">لا يوجد طلاب في هذا الفصل</div>`; return; }
  const ids = ls.map(l => l.id);
  const [jr, cf] = await Promise.all([
    sb.from("learner_journey").select("learner_id, status").eq("value_id", ctx.chal.v).in("learner_id", ids),
    sb.from("challenge_confirmations").select("learner_id").eq("value_id", ctx.chal.v).in("learner_id", ids)
  ]);
  if (jr.error || cf.error) { box.innerHTML = `<div class="note err">${esc(dbErr(jr.error || cf.error))}</div>`; return; }
  const stOf = Object.fromEntries(jr.data.map(r => [r.learner_id, r.status]));
  const done = new Set(cf.data.map(r => r.learner_id));
  const lbl = { locked: "لم يصل بعد", current: "في المحطة", completed: "أكمل المحطة" };
  box.innerHTML = ls.map(l => `<div class="lrow"><span class="nm">${esc(l.full_name)}<br><small style="color:var(--muted);font-weight:500">${lbl[stOf[l.id]] || ""}</small></span>
    ${done.has(l.id) ? `<span class="sbtn on" style="display:inline-flex;align-items:center">✓ مؤكد</span>` : stOf[l.id] === "locked" ? "" : `<button class="sbtn" data-ok="${l.id}">تأكيد التحدي</button>`}</div>`).join("") + `<div class="note" id="cnote"></div>`;
  box.querySelectorAll("[data-ok]").forEach(b => b.onclick = async () => {
    b.disabled = true;
    const { error } = await sb.from("challenge_confirmations").insert({ learner_id: b.dataset.ok, value_id: ctx.chal.v, confirmed_by: ctx.id.id });
    if (error) { b.disabled = false; const n = document.getElementById("cnote"); n.className = "note err"; n.textContent = error.code === "23505" ? "مؤكد مسبقًا" : dbErr(error); return; }
    viewChallenges(el, ctx);
  });
}

let cerHtml = null;
function cerSource() {
  if (!cerHtml) { const bin = atob(CER_HTML_B64), u = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i); cerHtml = new TextDecoder().decode(u); }
  return cerHtml.split("__LOGO__").join(LOGO);
}
function honorTexts(type, vname) {
  if (type === "value_hero") return { tag: `قيمة ${vname}`, line: `بطل كفو في قيمة ${vname}`, certLine: `بوسام كفو الذهبي لتميّزه في قيمة ${vname}` };
  if (type === "journey_hero") return { tag: "رحلة القيم التسع", line: "بطل رحلة القيم التسع", certLine: "بوسام كفو الذهبي لإتمامه رحلة القيم التسع بتميّز" };
  return { tag: "تكريم خاص", line: "بطل كفو المتميّز", certLine: "بوسام كفو الذهبي تقديرًا لتميّزه" };
}
function hijriOf(d) { try { return new Intl.DateTimeFormat("ar-SA-u-ca-islamic-umalqura", { day: "numeric", month: "long", year: "numeric" }).format(d ? new Date(d) : new Date()); } catch { return d || ""; } }
async function loadHonorCards(id) {
  const box = document.getElementById("honorCards"); if (!box) return;
  const { data, error } = await sb.from("honors").select("id, nomination_id, honor_type, value_id, photo_path, photo_approved, ceremony_status, honored_on").eq("learner_id", id.id).order("created_at");
  if (error || !data?.length || !document.getElementById("honorCards")) return;
  const v = await sb.from("core_values").select("id, name");
  const VN = x => v.data?.find(y => y.id === x)?.name || "";
  box.innerHTML = data.map(hn => `<div class="crown"><button class="crownbtn" data-cer="${hn.id}"><span class="ico">👑</span><span><b>حفل تتويجك</b><small>${esc(honorTexts(hn.honor_type, VN(hn.value_id)).line)}</small></span></button>
    <button class="sbtn gold" data-pc="${hn.id}">🖨️ شهادتي</button></div>`).join("");
  box.querySelectorAll("[data-cer]").forEach(b => b.onclick = () => openCeremony(id, data.find(x => x.id === b.dataset.cer), VN));
  box.querySelectorAll("[data-pc]").forEach(b => b.onclick = async () => { const d = await ceremonyData(id, data.find(x => x.id === b.dataset.pc), VN); if (d.err) return alertBox(d.err); printCert(d); });
}
async function ceremonyData(id, hn, VN) {
  const [c, f, set] = await Promise.all([
    sb.from("certificates").select("serial, version").eq("honor_id", hn.id),
    sb.from("family_messages").select("body, sender_name, status").eq("nomination_id", hn.nomination_id).eq("status", "approved"),
    sb.from("app_settings").select("value").eq("key", "ceremony_nasheed_path").maybeSingle()
  ]);
  if (c.error) return { err: dbErr(c.error) };
  let photo = null, nasheed = null;
  if (hn.photo_approved && hn.photo_path) { const r = await sb.storage.from("honor-photos").createSignedUrl(hn.photo_path, 3600); photo = r.data?.signedUrl || null; }
  if (set.data?.value) { const r = await sb.storage.from("ceremony-audio").createSignedUrl(set.data.value, 3600); nasheed = r.data?.signedUrl || null; }
  const cert = (c.data || []).sort((a, b) => b.version - a.version)[0];
  const m = (f.data || [])[0];
  return { name: id.name, value: VN(hn.value_id), ...honorTexts(hn.honor_type, VN(hn.value_id)), serial: cert?.serial || "", date: hijriOf(hn.honored_on),
    photo, nasheed, msg: m ? (m.body || "") + (m.sender_name ? `\n— ${m.sender_name}` : "") : "" };
}
async function openCeremony(id, hn, VN) {
  TTS.stop();
  const d = await ceremonyData(id, hn, VN);
  if (d.err) return alertBox(d.err);
  const ov = document.createElement("div"); ov.className = "cerov";
  ov.innerHTML = `<iframe title="مراسم التتويج" allow="autoplay; gyroscope; accelerometer"></iframe><button class="cerx" aria-label="إغلاق">✕</button>`;
  document.body.appendChild(ov); document.body.style.overflow = "hidden";
  const fr = ov.querySelector("iframe");
  const close = () => { window.removeEventListener("message", onMsg); ov.remove(); document.body.style.overflow = ""; pageLearner(id); };
  const onMsg = e => {
    if (e.source !== fr.contentWindow) return;
    if (e.data?.type === "kafu-cer-ready") fr.contentWindow.postMessage({ type: "kafu-cer", ...d, photo: d.photo || undefined }, "*");
    if (e.data?.type === "kafu-cer-done") close();
  };
  window.addEventListener("message", onMsg);
  ov.querySelector(".cerx").onclick = close;
  fr.srcdoc = cerSource();
}
function alertBox(t) { const b = document.createElement("div"); b.className = "modal"; b.innerHTML = `<div class="in"><p style="font-size:18px">${esc(t)}</p><button class="btn navy" style="width:100%">حسنًا</button></div>`; document.body.appendChild(b); b.querySelector("button").onclick = () => b.remove(); }
function printCert(d) {
  document.getElementById("printCert")?.remove();
  const w = document.createElement("div"); w.id = "printCert";
  w.innerHTML = `<div class="pc-bar"><button class="btn navy" id="pcPrint">طباعة أو حفظ PDF</button><button class="btn ghost" id="pcClose">إغلاق</button></div>
    <div class="pc"><div class="pc-in">

      <div class="pc-school">مدرسة الإمام قالون للطفولة المبكرة</div>

      ${d.photo ? `<img class="pc-photo" src="${esc(d.photo)}" alt="">` : ""}
      <p class="pc-lead">تتشرّف المدرسة بتتويج البطل</p>
      <div class="pc-name">${esc(d.name)}</div>
      <p class="pc-line">${esc(d.certLine)}</p>
      <p class="pc-motto">ضمن برنامج «إنت كفو.. رحلة القيم تصنع أثرًا»</p>
      <div class="pc-foot"><div><span>تاريخ التكريم</span><b>${esc(d.date)}</b></div><div><span>رقم الشهادة</span><b><bdi>${esc(d.serial)}</bdi></b></div><div><span>مديرة المدرسة</span><b class="sig"></b></div></div>

  document.body.appendChild(w);

async function pageLadder(id) {
  TTS.stop();
  h(header(id) + `<div class="wrap"><div class="loading">جارٍ التحميل…</div></div>`); wireHeader();
  const body = document.querySelector(".wrap");
  const [g, v, j, hero] = await Promise.all([
    sb.from("app_settings").select("value").eq("key", "treasure_game").maybeSingle(),
    sb.from("core_values").select("id, name, color, sort_order").order("sort_order"),
    sb.from("learner_journey").select("status").eq("learner_id", id.id),
    sb.from("badges").select("badge_key").eq("learner_id", id.id).eq("badge_key", "kafu_hero").maybeSingle()
  ]);
  const err = g.error || v.error || j.error;
  if (err) { body.innerHTML = `<div class="empty">${esc(dbErr(err))}</div>`; return; }
  const G = g.data?.value;
  if (!G || !Array.isArray(G.steps) || !G.steps.length) { body.innerHTML = `<div class="empty">التحدي الختامي قيد الإعداد</div><button class="btn ghost" id="bk" style="margin-top:14px">→ رحلتي</button>`; document.getElementById("bk").onclick = () => pageLearner(id); return; }
  if (!j.data.length || j.data.some(x => x.status !== "completed")) { pageLearner(id); return; }
  const steps = G.steps.map(st => ({ ...st, v: v.data.find(x => x.id === st.value_id) || { name: "", color: "#0E2A5E" } }));
  const N = steps.length, wasHero = !!hero.data;
  let at = 0;
  body.innerHTML = `<div class="topbar" style="margin-top:10px"><button class="btn ghost" id="bk">→ رحلتي</button></div>
    <h2 class="hello" style="margin-bottom:4px">${esc(G.title || "سلّم كفو")}</h2>
    <div class="ladder" id="ld">
      <div class="peak" id="peak"><div class="rays"></div><img src="${LOGO}" alt="شعار كفو"></div>
      ${steps.map((st, i) => `<div class="rung" data-r="${i}" style="--c:${esc(st.v.color || "#0E2A5E")};--i:${i};--n:${N}"><span>${esc(st.v.name)}</span></div>`).reverse().join("")}
      <div class="hero-star" id="star">⭐</div>
    </div>
    <div id="qp"></div>`;
  document.getElementById("bk").onclick = () => { TTS.stop(); pageLearner(id); };
  const place = () => {
    const ld = document.getElementById("ld"), r = ld.querySelector(`[data-r="${Math.min(at, N - 1)}"]`), star = document.getElementById("star");
    ld.querySelectorAll(".rung").forEach(x => { const k = +x.dataset.r; x.classList.toggle("lit", k < at); x.classList.toggle("next", k === at); });
    document.getElementById("peak").style.setProperty("--glow", (0.25 + 0.75 * at / N).toFixed(2));
    if (at >= N) { star.style.top = "62px"; star.style.left = "calc(50% - 18px)"; return; }
    star.style.top = (r.offsetTop - 4) + "px"; star.style.left = (r.offsetLeft >= 34 ? r.offsetLeft - 32 : r.offsetLeft + r.offsetWidth + 2) + "px";
  };
  const intro = () => {
    document.getElementById("qp").innerHTML = `<div class="sit"><div class="txt"><p>${esc(G.intro || "")}</p></div>${say(G.intro || "")}</div>
      <button class="btn gold" id="start" style="width:100%;margin-top:14px">ابدأ الصعود ⬆</button>`;
    wireSay(document.getElementById("qp"));
    document.getElementById("start").onclick = () => { TTS.stop(); ask(); };
  };
  const ask = () => {
    const st = steps[at];
    const opts = shuffle([{ t: st.right, ok: true }, ...(st.wrong || []).map(t => ({ t, ok: false }))]);
    const qp = document.getElementById("qp");
    qp.innerHTML = `<p class="hint">الدرجة ${at + 1} من ${N} · <b style="color:${esc(st.v.color)}">${esc(st.v.name)}</b> · ${esc(st.type || "")}</p>
      <div class="sit"><div class="txt"><p>${esc(st.q)}</p></div>${say(st.q + " " + opts.map(o => o.t).join("، "))}</div>
      <div class="opts${opts.length === 2 ? " two" : ""}">${opts.map((o, k) => `<button class="opt" data-k="${k}">${esc(o.t)}</button>`).join("")}</div>
      <div class="fb" id="fb"></div>`;
    wireSay(qp);
    qp.querySelectorAll(".opt").forEach(b => b.onclick = () => {
      const o = opts[+b.dataset.k], fb = document.getElementById("fb");
      if (!o.ok) {
        b.classList.add("bad"); setTimeout(() => b.classList.remove("bad"), 600);
        fb.className = "fb err"; fb.textContent = `${G.retry || "حاول مرة أخرى"}. ${st.hint || ""}`; TTS.speak(fb.textContent); return;
      }
      qp.querySelectorAll(".opt").forEach(x => x.disabled = true);
      b.classList.add("good"); fb.className = "fb ok"; fb.textContent = st.praise || "أحسنت!"; TTS.speak(fb.textContent);
      at++; place();
      setTimeout(() => { TTS.stop(); at < N ? ask() : summit(); }, 1500);
    });
  };
  const summit = async () => {
    const qp = document.getElementById("qp");
    qp.innerHTML = `<div class="loading">جارٍ الحفظ…</div>`;
    const { error } = await sb.from("attempts").insert({ learner_id: id.id, kind: "treasure", score: 100, answers: { steps: N } });
    if (error) { qp.innerHTML = `<div class="empty">${esc(dbErr(error))}</div><button class="btn navy" id="rt" style="width:100%;margin-top:12px">إعادة المحاولة</button>`; document.getElementById("rt").onclick = summit; return; }
    document.getElementById("ld").classList.add("won");
    qp.innerHTML = `<div class="cele summit"><div class="confetti">${Array.from({ length: 24 }, (_, k) => `<i style="--k:${k}"></i>`).join("")}</div>
      <h3>أنت بطل كفو! 🏆</h3>${wasHero ? "" : `<div class="plus">+300 نقطة</div>`}<p>${esc(G.final || "")}</p>
      <button class="btn gold" id="done" style="width:100%">إلى رحلتي</button></div>`;
    TTS.speak("أنت بطل كفو! " + (G.final || ""));
    document.getElementById("done").onclick = () => { TTS.stop(); pageLearner(id); };
    qp.scrollIntoView({ behavior: "smooth", block: "start" });
  };
  place(); window.addEventListener("resize", place, { once: true });
  intro();
}

function tabsHtml(tabs, cur) { return `<div class="tabs">${tabs.map(([k, n]) => `<button class="tab${k === cur ? " on" : ""}" data-tab="${k}">${n}</button>`).join("")}</div>`; }

async function loadClassData(ctx) {
  const [c, l, ct, st] = await Promise.all([
    sb.from("classes").select("id, name, stage").is("archived_at", null).order("name"),
    sb.from("learners").select("id, class_id").is("archived_at", null),
    sb.from("class_teachers").select("class_id, staff_id"),
    sb.from("staff").select("id, full_name").eq("role", "teacher").eq("active", true).order("full_name")
  ]);
  const err = c.error || l.error || ct.error || st.error;
  if (err) return { err };
  const count = {}; l.data.forEach(x => count[x.class_id] = (count[x.class_id] || 0) + 1);
  const mine = new Set(ct.data.filter(x => x.staff_id === ctx.id.id).map(x => x.class_id));
  const classes = c.data.map(x => ({ ...x, n: count[x.id] || 0, mine: mine.has(x.id), teachers: ct.data.filter(t => t.class_id === x.id).map(t => t.staff_id) }));
  classes.sort((a, b) => (b.mine - a.mine) || STAGES.indexOf(a.stage) - STAGES.indexOf(b.stage) || a.name.localeCompare(b.name, "ar"));
  return { classes, teachers: st.data };
}

async function shrinkImage(file, max = 900) {
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
    const k = Math.min(1, max / Math.max(img.width, img.height));
    const c = document.createElement("canvas"); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
    c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
    return await new Promise(res => c.toBlob(res, "image/jpeg", 0.85));
  } finally { URL.revokeObjectURL(url); }
}

    <div class="box"><h2 style="font-size:19px">نوع التكريم</h2>
      <div class="chips" id="types">${HONOR_TYPES.map(([k, n]) => `<button class="chip${k === type ? " on" : ""}" data-ht="${k}">${n}</button>`).join("")}</div>
      <div id="valBox" style="margin-top:12px"><select class="field" id="val"><option value="">اختاري القيمة…</option>${v.data.map(x => `<option value="${x.id}">${esc(x.name)}</option>`).join("")}</select></div></div>
    <div class="box"><h2 style="font-size:19px">سبب الترشيح</h2>
      <p class="hint">اكتبي موقفًا أو سلوكًا لاحظتِه يستحق عليه التكريم.</p>
      <textarea class="field" id="why" maxlength="600" style="min-height:110px" placeholder="مثال: لاحظتُ أنه يصل قبل الطابور كل يوم، ويساعد زملاءه في ترتيب الفصل."></textarea></div>
    <div class="box"><h2 style="font-size:19px">موافقة الأسرة</h2>
      <label class="chk"><input type="checkbox" id="consent"> وافق ولي الأمر على تكريم الطالب وظهور اسمه في لوحة الشرف</label></div>
    <div class="box"><h2 style="font-size:19px">صورة الطالب للوسام والشهادة</h2>
      ${canPhoto ? `<input type="file" accept="image/*" id="photo" class="field" style="padding:10px"><img id="prev" alt="" style="display:none;max-width:140px;border-radius:50%;margin-top:10px;aspect-ratio:1;object-fit:cover">
        <p class="hint">اختيارية. تُصغَّر تلقائيًا، ولا تظهر إلا بعد اعتماد الإدارة.</p>`
        : `<div class="note">لا توجد موافقة صورة لهذا الطالب، فلن تُستخدم صورته. يمكن تفعيلها من صفحة الفصل إذا وافق ولي الأمر.</div>`}</div>
    <div class="box"><h2 style="font-size:19px">رسالة الأسرة <span class="hint" style="font-size:14px">(اختيارية)</span></h2>
      <div class="row"><input class="field" id="fsName" maxlength="60" placeholder="اسم المرسل، مثل: أم محمد"><input class="field" id="fsRel" maxlength="30" placeholder="الصلة، مثل: الأم" style="flex:0 1 140px"></div>
      <textarea class="field" id="fsBody" maxlength="500" style="min-height:100px;margin-top:8px" placeholder="رسالة قصيرة تُعرض للطالب في حفل تتويجه"></textarea></div>
    <div class="savebar"><div class="note" id="sNote"></div><button class="btn navy" id="save">رفع الترشيح</button></div>`;
  const note = (t, c) => { const n = document.getElementById("sNote"); n.className = "note " + (c || ""); n.textContent = t; };
  document.getElementById("back").onclick = async () => { if (await canLeave()) { leaveGuard = null; back(); } };
  el.querySelectorAll("input,textarea,select").forEach(i => i.addEventListener("input", () => { dirty = true; }));
  const syncType = () => { el.querySelectorAll("[data-ht]").forEach(b => b.classList.toggle("on", b.dataset.ht === type)); document.getElementById("valBox").style.display = type === "value_hero" ? "" : "none"; };
  el.querySelectorAll("[data-ht]").forEach(b => b.onclick = () => { type = b.dataset.ht; dirty = true; syncType(); });
  syncType();
  const ph = document.getElementById("photo");
  if (ph) ph.onchange = () => { const f = ph.files[0], pv = document.getElementById("prev"); if (f) { pv.src = URL.createObjectURL(f); pv.style.display = "block"; } else pv.style.display = "none"; };
  document.getElementById("save").onclick = async () => {
    const why = document.getElementById("why").value.trim();
    const vid = type === "value_hero" ? +document.getElementById("val").value || null : null;
    if (type === "value_hero" && !vid) return note("اختاري القيمة", "err");
    if (why.length < 5) return note("اكتبي سبب الترشيح (5 أحرف على الأقل)", "err");
    const dup = ex.data.find(x => x.status !== "rejected" && x.honor_type === type && (x.value_id || null) === vid);
    if (dup) return note(dup.status === "approved" ? "هذا التكريم معتمد للطالب مسبقًا" : "يوجد ترشيح مماثل بانتظار الاعتماد", "err");
    const fsBody = document.getElementById("fsBody").value.trim();
    const btn = document.getElementById("save"); btn.disabled = true; note("جارٍ الرفع…");
    let photo_path = null;
    if (ph && ph.files[0]) {
      try {
        const blob = await shrinkImage(ph.files[0]);
        const path = `${learner.id}/${Date.now()}.jpg`;
        const up = await sb.storage.from("honor-photos").upload(path, blob, { contentType: "image/jpeg" });
        if (up.error) { btn.disabled = false; return note("تعذّر رفع الصورة: " + dbErr(up.error), "err"); }
        photo_path = path;
      } catch { btn.disabled = false; return note("تعذّر قراءة الصورة، جرّبي صورة أخرى", "err"); }
    }
    const row = { nominee_type: "learner", learner_id: learner.id, honor_type: type, value_id: vid, justification: why,
      family_consent: document.getElementById("consent").checked, photo_path, status: "pending", nominated_by: ctx.id.id };
    const { data: nom, error } = await sb.from("nominations").insert(row).select("id").single();
    if (error) { btn.disabled = false; return note(dbErr(error), "err"); }
    if (fsBody) {
      const fm = await sb.from("family_messages").insert({ nomination_id: nom.id, sender_name: document.getElementById("fsName").value.trim() || null,
        relation: document.getElementById("fsRel").value.trim() || null, body: fsBody, status: "pending", uploaded_by: ctx.id.id });
      if (fm.error) { dirty = false; leaveGuard = null; btn.disabled = false; return note("رُفع الترشيح، لكن تعذّر حفظ رسالة الأسرة: " + dbErr(fm.error), "err"); }
    }
    dirty = false; leaveGuard = null;
    note("✓ رُفع الترشيح بانتظار اعتماد الإدارة", "ok");
    setTimeout(back, 900);
  };
}

// ---------- تقييم القيم ----------
async function viewRate(el, ctx) {
  const [q, d] = await Promise.all([
    sb.from("measurement_queue").select("class_id, value_id, value_name, sort_order, phase, learners"),
    loadClassData(ctx)
  ]);
  if (q.error || d.err) { el.innerHTML = `<div class="empty">${esc(dbErr(q.error || d.err))}</div>`; return; }
  const byClass = d.classes.map(c => ({ c, items: q.data.filter(x => x.class_id === c.id).sort((a, b) => a.sort_order - b.sort_order || (a.phase === "post") - (b.phase === "post")) })).filter(x => x.items.length);
  el.innerHTML = `<h2 style="font-size:24px;margin:12px 0 2px">المطلوب الآن</h2>
    <p class="hint">يظهر <b>القياس القبلي</b> عندما يصل الطالب إلى محطة القيمة، و<b>القياس البعدي</b> فور إكماله المحطة. اضغطي أي سطر لفتح ورقة التقييم.</p>
    ${byClass.length ? byClass.map(({ c, items }) => `<h3 style="font-size:20px;margin:16px 0 4px">${esc(c.name)}${c.mine && !ctx.isAdmin ? '<span class="mine">فصلي</span>' : ""}</h3>` +
      items.map(x => `<button class="qrow" data-q="${c.id}|${x.value_id}|${x.phase}"><div><b>${esc(x.value_name)}</b><span style="color:var(--muted);font-size:15px">${x.learners} طالب بحاجة إلى تقييم</span></div><span class="ph ${x.phase}">${x.phase === "pre" ? "قبلي" : "بعدي"}</span></button>`).join("")).join("")
      : `<div class="empty">لا توجد تقييمات مطلوبة الآن ✓<br><span style="font-size:15px;color:var(--muted)">${d.classes.length ? "كل الطلاب مقيَّمون حتى محطاتهم الحالية." : "أضيفي الفصول والأسماء أولًا."}</span></div>`}`;
  el.querySelectorAll("[data-q]").forEach(b => b.onclick = () => {
    const [cid, vid, ph] = b.dataset.q.split("|");
    const item = q.data.find(x => x.class_id === cid && String(x.value_id) === vid);
    viewSheet(el, ctx, d.classes.find(c => c.id === cid), { id: item.value_id, name: item.value_name }, ph);
  });
}
async function viewSheet(el, ctx, cls, val, phase) {
  el.innerHTML = `<div class="loading">جارٍ التحميل…</div>`;
  const { data, error } = await sb.from("rating_sheet")
    .select("learner_id, full_name, journey_status, indicator_id, indicator_text, sort_order, pre_score, post_score")
    .eq("class_id", cls.id).eq("value_id", val.id);
  if (error) { el.innerHTML = `<div class="empty">${esc(dbErr(error))}</div>`; return; }
  const okStatus = phase === "pre" ? ["current", "completed"] : ["completed"];
  const inds = [...new Map(data.map(r => [r.indicator_id, { id: r.indicator_id, text: r.indicator_text, s: r.sort_order }])).values()].sort((a, b) => a.s - b.s);
  const lmap = new Map();
  data.filter(r => okStatus.includes(r.journey_status)).forEach(r => {
    if (!lmap.has(r.learner_id)) lmap.set(r.learner_id, { id: r.learner_id, name: r.full_name, pre: {}, cur: {} });
    const L = lmap.get(r.learner_id);
    L.pre[r.indicator_id] = r.pre_score;
    L.cur[r.indicator_id] = phase === "pre" ? r.pre_score : r.post_score;
  });
  const learners = [...lmap.values()].sort((a, b) => a.name.localeCompare(b.name, "ar"));
  const scores = {}; learners.forEach(L => inds.forEach(i => { if (L.cur[i.id]) scores[L.id + "|" + i.id] = L.cur[i.id]; }));
  let dirty = false;
  leaveGuard = async () => !dirty || await confirmBox("لم تُحفظ الدرجات بعد. الخروج بدون حفظ؟");
  const canRate = (L, i) => phase === "pre" || !!L.pre[i.id];
  el.innerHTML = `<div class="topbar" style="margin-top:12px"><button class="btn ghost" id="back">→ المطلوب الآن</button></div>
    <h2 style="font-size:26px">${esc(val.name)} <span class="ph ${phase}">${phase === "pre" ? "قياس قبلي" : "قياس بعدي"}</span></h2>
    <p class="hint">${esc(cls.name)} · ${learners.length} طالب · اختاري لكل سمة ما ينطبق على سلوك الطالب الذي لاحظتِه. زر «الكل» يضع الدرجة نفسها لكل السمات ثم تعدّلين ما يلزم.</p>
    <div class="legend">${SCORE_LABELS.map((s, i) => `<div class="s${i + 1}">${i + 1}<br>${s}</div>`).join("")}</div>
    ${learners.length ? learners.map(L => `<div class="lcard" data-lc="${L.id}"><h3>${esc(L.name)}<span class="all">الكل:${[1, 2, 3, 4].map(v => `<button data-all="${v}">${v}</button>`).join("")}</span></h3>
      ${inds.map(i => `<div class="ind"><p>${esc(i.text)}</p><div class="sc" data-k="${L.id}|${i.id}">${[1, 2, 3, 4].map(v => `<button class="v${v}${scores[L.id + "|" + i.id] === v ? " on" : ""}" data-v="${v}"${canRate(L, i) ? "" : " disabled"}>${v}</button>`).join("")}</div>${canRate(L, i) ? "" : '<p class="hint" style="margin:4px 0 0">لا يوجد قياس قبلي لهذه السمة</p>'}</div>`).join("")}</div>`).join("")
      : `<div class="empty">لا يوجد طلاب بحاجة إلى هذا القياس</div>`}
    ${learners.length ? `<div class="savebar"><div class="note" id="sNote"></div><button class="btn navy" id="save">حفظ الورقة</button></div>` : ""}`;
  document.getElementById("back").onclick = async () => { if (await canLeave()) { leaveGuard = null; viewRate(el, ctx); } };
  const total = () => learners.reduce((n, L) => n + inds.filter(i => canRate(L, i)).length, 0);
  const status = () => { const s = document.getElementById("sNote"); if (s) { const n = Object.keys(scores).length; s.className = "note"; s.textContent = `${n} من ${total()} درجة`; } };
  status();
  const setScore = (k, v) => {
    scores[k] = v; dirty = true;
    el.querySelectorAll(`[data-k="${k}"] button`).forEach(b => b.classList.toggle("on", +b.dataset.v === v));
  };
  el.querySelectorAll(".sc button").forEach(b => b.onclick = () => { setScore(b.parentElement.dataset.k, +b.dataset.v); status(); });
  el.querySelectorAll("[data-all]").forEach(b => b.onclick = () => {
    const card = b.closest("[data-lc]"), L = lmap.get(card.dataset.lc);
    inds.filter(i => canRate(L, i)).forEach(i => setScore(L.id + "|" + i.id, +b.dataset.all)); status();
  });
  const sv = document.getElementById("save");
  if (sv) sv.onclick = async () => {
    const items = Object.entries(scores).map(([k, score]) => { const [learner_id, indicator_id] = k.split("|"); return { learner_id, indicator_id, score }; });
    const n = document.getElementById("sNote");
    if (!items.length) { n.className = "note err"; n.textContent = "لم تُختر أي درجة"; return; }
    sv.disabled = true; n.className = "note"; n.textContent = "جارٍ الحفظ…";
    const { data: cnt, error } = await sb.rpc("save_ratings", { p_staff: ctx.id.id, p_phase: phase, p_items: items });
    sv.disabled = false;
    if (error) { n.className = "note err"; n.textContent = dbErr(error); return; }
    dirty = false;
    n.className = "note ok"; n.textContent = `✓ حُفظت ${cnt ?? items.length} درجة`;
  };
}

// ---------- التحصيل والحضور ----------
const ACH_LABELS = ["لم يتقن", "بداية", "متقن جزئيًا", "متقن"];
async function achInfo() {
  const [s, o] = await Promise.all([
    sb.from("app_settings").select("value").eq("key", "current_term").maybeSingle(),
    sb.from("learning_outcomes").select("id").eq("code", "GEN").maybeSingle()
  ]);
  if (s.error || o.error) return { err: s.error || o.error };
  return { term: s.data?.value || null, outcomeId: o.data?.id || null };
}
async function viewAchieve(el, ctx) {
  const [d, info] = await Promise.all([loadClassData(ctx), achInfo()]);
  if (d.err || info.err) { el.innerHTML = `<div class="empty">${esc(dbErr(d.err || info.err))}</div>`; return; }
  if (!info.term || !info.outcomeId) { el.innerHTML = `<div class="empty">لم يُجهَّز بند «التحصيل الدراسي العام» أو الفصل الدراسي الحالي في قاعدة البيانات بعد.<br><span style="font-size:15px;color:var(--muted)">تواصلي مع الإدارة.</span></div>`; return; }
  const [ls, om, ta] = await Promise.all([
    sb.from("learners").select("id, class_id").is("archived_at", null),
    sb.from("outcome_measurements").select("learner_id, phase").eq("outcome_id", info.outcomeId).eq("term", info.term),
    sb.from("term_attendance").select("learner_id").eq("term", info.term)
  ]);
  if (ls.error || om.error || ta.error) { el.innerHTML = `<div class="empty">${esc(dbErr(ls.error || om.error || ta.error))}</div>`; return; }
  const cls = d.classes.filter(c => c.n > 0);
  const stat = c => {
    const ids = new Set(ls.data.filter(l => l.class_id === c.id).map(l => l.id));
    const cnt = ph => om.data.filter(m => m.phase === ph && ids.has(m.learner_id)).length;
    return { pre: cnt("pre"), post: cnt("post"), att: ta.data.filter(a => ids.has(a.learner_id)).length, n: ids.size };
  };
  el.innerHTML = `<h2 style="font-size:24px;margin:12px 0 2px">التحصيل والحضور</h2>
    <p class="hint">الفصل الدراسي: <b>${esc(info.term)}</b> · أدخلي مستوى التحصيل العام <b>قبليًا</b> في بداية الفصل الدراسي و<b>بعديًا</b> في نهايته، ثم الحضور. اضغطي الفصل للإدخال.</p>
    ${cls.length ? cls.map(c => { const s = stat(c); return `<button class="ccard" data-ac="${c.id}"><div><b>${esc(c.name)}${c.mine && !ctx.isAdmin ? '<span class="mine">فصلي</span>' : ""}</b>
      <span style="color:var(--muted);font-size:15px">قبلي ${s.pre}/${s.n} · بعدي ${s.post}/${s.n} · حضور ${s.att}/${s.n}</span></div><span class="cnt">${s.n} طالب</span></button>`; }).join("")
      : `<div class="empty">لا توجد فصول فيها طلاب بعد.</div>`}`;
  el.querySelectorAll("[data-ac]").forEach(b => b.onclick = () => viewAchClass(el, ctx, d.classes.find(c => c.id === b.dataset.ac), info, "pre"));
}
async function viewAchClass(el, ctx, cls, info, mode) {
  el.innerHTML = `<div class="loading">جارٍ التحميل…</div>`;
  const { data: ls, error } = await sb.from("learners").select("id, full_name").eq("class_id", cls.id).is("archived_at", null).order("full_name");
  if (error) { el.innerHTML = `<div class="empty">${esc(dbErr(error))}</div>`; return; }
  const ids = ls.map(l => l.id);
  const [om, ta] = await Promise.all([
    sb.from("outcome_measurements").select("learner_id, phase, level").eq("outcome_id", info.outcomeId).eq("term", info.term).in("learner_id", ids),
    sb.from("term_attendance").select("learner_id, school_days, absences, late_days").eq("term", info.term).in("learner_id", ids)
  ]);
  if (om.error || ta.error) { el.innerHTML = `<div class="empty">${esc(dbErr(om.error || ta.error))}</div>`; return; }
  const lvl = (lid, ph) => om.data.find(m => m.learner_id === lid && m.phase === ph)?.level || null;
  const learners = [...ls].sort((a, b) => a.full_name.localeCompare(b.full_name, "ar"));
  let dirty = false;
  leaveGuard = async () => !dirty || await confirmBox("لم تُحفظ البيانات بعد. الخروج بدون حفظ؟");
  const modes = [["pre", "تحصيل قبلي"], ["post", "تحصيل بعدي"], ["att", "الحضور"]];
  const top = `<div class="topbar" style="margin-top:12px"><button class="btn ghost" id="back">→ كل الفصول</button></div>
    <h2 style="font-size:26px">${esc(cls.name)} <span style="font-size:17px;color:var(--muted)">${esc(info.term)} · ${learners.length} طالب</span></h2>
    <div class="chips" style="margin:8px 0 12px">${modes.map(([k, n]) => `<button class="chip${k === mode ? " on" : ""}" data-mode="${k}">${n}</button>`).join("")}</div>`;
  const wireTop = () => {
    document.getElementById("back").onclick = async () => { if (await canLeave()) { leaveGuard = null; viewAchieve(el, ctx); } };
    el.querySelectorAll("[data-mode]").forEach(b => b.onclick = async () => { if (b.dataset.mode === mode) return; if (await canLeave()) { leaveGuard = null; viewAchClass(el, ctx, cls, info, b.dataset.mode); } });
  };
  const note = (t, cls2) => { const n = document.getElementById("sNote"); if (n) { n.className = "note " + (cls2 || ""); n.textContent = t; } };

  if (mode === "pre" || mode === "post") {
    const sel = {}; learners.forEach(l => { const v = lvl(l.id, mode); if (v) sel[l.id] = v; });
    const can = l => mode === "pre" || !!lvl(l.id, "pre");
    el.innerHTML = top + `<p class="hint">${mode === "pre" ? "مستوى التحصيل الدراسي العام لكل طالب في <b>بداية</b> الفصل الدراسي." : "مستوى التحصيل الدراسي العام لكل طالب في <b>نهاية</b> الفصل الدراسي. لا يُدخل البعدي إلا لمن له قبلي."}</p>
      <div class="legend">${ACH_LABELS.map((s, i) => `<div class="s${i + 1}">${i + 1}<br>${s}</div>`).join("")}</div>
      ${learners.length ? learners.map(l => `<div class="lcard"><h3>${esc(l.full_name)}${mode === "post" && lvl(l.id, "pre") ? `<span class="hint" style="font-size:14px;margin-inline-start:8px">القبلي: ${lvl(l.id, "pre")}</span>` : ""}</h3>
        <div class="sc" data-k="${l.id}">${[1, 2, 3, 4].map(v => `<button class="v${v}${sel[l.id] === v ? " on" : ""}" data-v="${v}"${can(l) ? "" : " disabled"}>${v}</button>`).join("")}</div>
        ${can(l) ? "" : '<p class="hint" style="margin:4px 0 0">لا يوجد قياس قبلي لهذا الطالب</p>'}</div>`).join("")
        : `<div class="empty">لا يوجد طلاب في هذا الفصل</div>`}
      ${learners.length ? `<div class="savebar"><div class="note" id="sNote"></div><button class="btn navy" id="save">حفظ</button></div>` : ""}`;
    wireTop();
    const total = learners.filter(can).length;
    const status = () => note(`${Object.keys(sel).length} من ${total} طالب`);
    status();
    el.querySelectorAll(".sc button").forEach(b => b.onclick = () => {
      const k = b.parentElement.dataset.k, v = +b.dataset.v; sel[k] = v; dirty = true;
      b.parentElement.querySelectorAll("button").forEach(x => x.classList.toggle("on", +x.dataset.v === v)); status();
    });
    const sv = document.getElementById("save");
    if (sv) sv.onclick = async () => {
      const rows = Object.entries(sel).map(([learner_id, level]) => ({ learner_id, outcome_id: info.outcomeId, term: info.term, phase: mode, level, staff_id: ctx.id.id }));
      if (!rows.length) return note("لم يُختر أي مستوى", "err");
      sv.disabled = true; note("جارٍ الحفظ…");
      const { error } = await sb.from("outcome_measurements").upsert(rows, { onConflict: "learner_id,outcome_id,term,phase" });
      sv.disabled = false;
      if (error) return note(dbErr(error), "err");
      dirty = false; note(`✓ حُفظ مستوى ${rows.length} طالب`, "ok");
    };
    return;
  }

  // الحضور
  const att = new Map(ta.data.map(a => [a.learner_id, a]));

// ---------- الأثر (الإدارة) ----------
const MIN_N = 10;
const avg = a => a.length ? a.reduce((x, y) => x + y, 0) / a.length : null;
function pearson(xs, ys) {
  const n = xs.length; if (n < 3) return null;
  const mx = avg(xs), my = avg(ys); let sxy = 0, sx = 0, sy = 0;
  for (let i = 0; i < n; i++) { const dx = xs[i] - mx, dy = ys[i] - my; sxy += dx * dy; sx += dx * dx; sy += dy * dy; }
  return sx && sy ? sxy / Math.sqrt(sx * sy) : null;
}
function rText(r) {
  if (r === null) return "لا يمكن حسابها (البيانات غير كافية أو متطابقة)";
  const a = Math.abs(r), s = a < 0.1 ? "لا علاقة تُذكر" : (a < 0.3 ? "علاقة ضعيفة" : a < 0.5 ? "علاقة متوسطة" : "علاقة قوية") + (r > 0 ? " طردية" : " عكسية");
  return `${s} <bdi dir="ltr">(r = ${r.toFixed(2)})</bdi>`;
}
const fmt = (v, d = 1) => v === null || v === undefined || Number.isNaN(v) ? "—" : (+v).toFixed(d);
const caution = n => n < MIN_N ? `<div class="warnbox">عينة صغيرة (${n} طالب): النتيجة للاستئناس فقط، ولا يُبنى عليها حكم.</div>` : "";
const bar = (pct, color) => `<div class="ibar"><i style="width:${Math.max(0, Math.min(100, pct || 0))}%;background:${color}"></i></div>`;
